<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIREL Office · 모바일 미리보기</title>
<style>
  html,body{margin:0;height:100%;background:#2a231c;color:#f4ece0;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;box-sizing:border-box;}
  .cap{font-size:12px;color:#c9b9a5;letter-spacing:-0.01em;}
  .cap a{color:#e8d6bd;}
  .phone{width:390px;height:844px;max-width:100%;border-radius:44px;background:#000;padding:10px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.08);}
  .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#f7f1e8;}
  iframe{width:100%;height:100%;border:0;display:block;}
  @media (max-height:900px){ .phone{height:min(844px, calc(100vh - 96px));} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="phone"><div class="screen"><iframe src="./" title="VIREL Office 모바일 미리보기"></iframe></div></div>
    <div class="cap">390 × 844 모바일 미리보기 · <a href="./">전체 화면으로 열기</a></div>
  </div>
</body>
</html>
